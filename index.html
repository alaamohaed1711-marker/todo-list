<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dad{
        position: relative;
        display:flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 200px;
         font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .dad2{
        position: relative;
        display:flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        gap: 10px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }


       .delete-btn{
       background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

       }

       .task{
        display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      background: #f9f9f9;
      border-radius: 5px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

       }
        input:focus ,button:focus{
         outline: none;
        }

       .input{
        position: relative;
        display:flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgb(0, 225, 255);
        color: crimson;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
        padding: 3px;
       }
       .button{
        position: relative;
        display:flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgb(0, 225, 255);
        color: crimson;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
        padding: 3px;
        cursor: pointer;
       }
       button:hover{
        color: rgb(0, 89, 255);
        background-color: rgba(220, 20, 60, 0.479);
       }
       .task-text {
       cursor: pointer;  
       flex: 1; 
      }

       .completed {
          text-decoration: line-through;  
          color: rgb(0, 110, 255); 
          }
  

    
    </style>
</head>
<body>
    <div class="dad">
   <h2>📋 قائمة مهامي</h2>
   </div>
   <div class="dad2">
  <input class="input" type="text" id="myInput" placeholder="اكتب مهمة...">
  <button class="button" onclick="addTask()">أضف</button>
  </div>
  <br>
  <br>
  <div id="myList"></div>
  

  <script>

let tasks = [];

window.onload = function() {
  let saved = localStorage.getItem("myTasks");
  if (saved) {
    tasks = JSON.parse(saved);
    displayTasks();
  }
};

function addTask() {
  let input = document.getElementById("myInput");
  let text = input.value;
  if (text === "") return;

  tasks.push({ text: text, completed: false });
  saveTasks();
  displayTasks();
  input.value = "";
}

function displayTasks() {
  let list = document.getElementById("myList");
  list.innerHTML = "";

  tasks.forEach(function(task, index) {
    let taskDiv = document.createElement("div");
    taskDiv.className = "task";

    let taskText = document.createElement("span");
    taskText.innerText = task.text;
    taskText.className = "task-text";
    if (task.completed) {
      taskText.classList.add("completed");
    }

    taskText.onclick = function() {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      displayTasks();
    };

    let deleteBtn = document.createElement("button");
    deleteBtn.innerText = "حذف";
    deleteBtn.className = "delete-btn";
    deleteBtn.onclick = function() {
      tasks.splice(index, 1);
      saveTasks();
      displayTasks();
    };

    taskDiv.appendChild(taskText);
    taskDiv.appendChild(deleteBtn);
    list.appendChild(taskDiv);
  });
}

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

        </script>
    </div>
</body>
</html>
